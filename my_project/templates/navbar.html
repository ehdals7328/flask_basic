<!-- 상단 공통 네비게이션 헤더 (Bootstrap 반응형 토글 적용) -->
<header id="main-header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top px-4" style="background-color: rgba(18, 18, 18, 0.95) !important; backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
        <div class="container-fluid">
            <!-- 로고 영역 -->
            <a class="navbar-brand logo-text fw-bold text-white" href="{{ url_for('main.index') }}">Ai Project</a>

            <!-- 모바일용 햄버거 토글 버튼 -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- 접히고 펼쳐지는 메뉴 영역 -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3 align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link {% block nav_vision %}{% endblock %}" href="{{ url_for('main.vision') }}">Vision</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_rag %}{% endblock %}" href="{{ url_for('main.rag') }}">RAG</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_agent %}{% endblock %}" href="{{ url_for('main.agent') }}">Ai agent</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_faq %}{% endblock %}" href="{{ url_for('question._list') }}">FAQ</a>
                    </li>
                    {% if g.user %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('auth.logout') }}">{{ g.user.username }} (로그아웃)</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('auth.signup') }}">계정생성</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('auth.login') }}">로그인</a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>
</header>
