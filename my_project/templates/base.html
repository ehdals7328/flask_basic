<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ai Project{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static', filename='bootstrap.min.css')}}">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css') }}">
</head>

<body class="{% block body_class %}{% endblock %}">

<!-- 상단 공통 네비게이션 헤더 (Bootstrap 반응형 토글 적용) -->
<header id="main-header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top px-4" style="background-color: rgba(18, 18, 18, 0.95) !important; backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
        <div class="container-fluid">
            <!-- 로고 영역 -->
            <a class="navbar-brand logo-text fw-bold text-white" href="{{ url_for('main.index') }}">Ai Project</a>

            <!-- 모바일용 햄버거 토글 버튼 -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- 접히고 펼쳐지는 메뉴 영역 -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3 align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link {% block nav_vision %}{% endblock %}" href="{{ url_for('main.vision') }}">Vision</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_rag %}{% endblock %}" href="{{ url_for('main.rag') }}">RAG</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_agent %}{% endblock %}" href="{{ url_for('main.agent') }}">Ai agent</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% block nav_faq %}{% endblock %}" href="{{ url_for('question._list') }}">FAQ</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

    <!-- 페이지별 본문 영역 -->
    {% block content %}
    {% endblock %}

    <!-- 하단 공통 푸터 -->
    <footer class="footer" id="main-footer">
        <div class="footer-bottom">
            <p><a href="#">개인정보처리방침</a> | <a href="#">이용약관</a></p>
            <p>주소: 대구광역시 동구 동구대로 566</p>
        </div>
    </footer>

    <!-- 자바스크립트 영역 -->
    <script src="{{ url_for('static', filename='jquery-3.7.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
    {% block script %}{% endblock %}
</body>

</html>
