{% extends "base.html" %}

{% block content %}
<!-- 1. 배경을 흰색으로 변경하고 상단 Nav Bar에 가리지 않도록 padding-top: 90px 적용 -->
<div class="container-fluid bg-white min-vh-100" style="padding-top: 90px; padding-bottom: 50px;">
    <div class="container">
        <h3 class="mb-4 font-weight-bold text-dark"> Function Calling Agent </h3>

        <div class="row">
            <!-- 2. 좌측: 대화창 (카카오톡 스타일 말풍선) -->
            <div class="col-md-7 mb-4">
                <div class="card shadow-sm border" style="height: 650px; display: flex; flex-direction: column;">
                    <div class="card-header bg-primary text-white font-weight-bold">
                        💬 대화창 (Chat)
                    </div>

                    <!-- 카카오톡 특유의 연한 블루/민트 배경 (#bacee0) -->
                    <div class="card-body overflow-auto p-3" id="chat-box" style="flex: 1; background-color: #bacee0;">
                        <div class="text-center my-2">
                            <span class="badge badge-secondary px-3 py-2" style="font-weight: normal; opacity: 0.85;">
                                질문을 입력하시면 AI 에이전트가 적절한 도구(Tool)를 선택하여 답변합니다.
                            </span>
                        </div>
                    </div>

                    <!-- 입력 양식 -->
                    <div class="card-footer bg-white border-top">
                        <div class="input-group">
                            <input type="text" id="user-input" class="form-control" placeholder="예: 고객 C001의 최근 주문 내역 알려줘" onkeypress="if(event.keyCode==13) sendMessage();">
                            <div class="input-group-append">
                                <button class="btn btn-primary px-4" type="button" id="send-btn" onclick="sendMessage()">전송</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. 우측: 실행 로그창 -->
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm border" style="height: 650px; display: flex; flex-direction: column;">
                    <div class="card-header bg-dark text-white font-weight-bold">
                        ⚙️ 실행 로그 (Execution Log)
                    </div>
                    <div class="card-body overflow-auto bg-dark text-light p-3" id="log-box" style="flex: 1; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; line-height: 1.4;">
<span class="text-secondary">// 도구 호출 및 처리 과정이 이곳에 실시간으로 기록됩니다.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 마크다운 문법(**) 자동 렌더링용 marked.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
function sendMessage() {
    const inputField = $('#user-input');
    const message = inputField.val().trim();

    if (!message) return;

    // 1. 사용자 입력 메시지를 대화창에 추가
    appendMessage('user', message);
    inputField.val('');
    $('#send-btn').prop('disabled', true);

    // 로딩 상태 표시
    const loadingId = appendLoading();

    // 2. 백엔드 API 호출 (블루프린트 경로에 맞춰 필요 시 수정)
    $.ajax({
        url: '/my_agent/chat',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ message: message }),
        success: function(response) {
            $('#' + loadingId).remove();

            if (response.status === 'success') {
                // AI 최종 답변
                appendMessage('assistant', response.answer);
                // 우측 로그 갱신
                appendLog(response.log);
            } else {
                appendMessage('assistant', '⚠️ 에러가 발생했습니다: ' + response.error);
            }
        },
        error: function(xhr, status, error) {
            $('#' + loadingId).remove();
            appendMessage('assistant', '⚠️ 서버와 통신 중 오류가 발생했습니다.');
        },
        complete: function() {
            $('#send-btn').prop('disabled', false);
            $('#user-input').focus();
        }
    });
}

// 카카오톡 스타일 레이아웃 메시지 추가 함수
function appendMessage(sender, text) {
    const chatBox = $('#chat-box');
    const isUser = sender === 'user';

    let html = '';

    if (isUser) {
        // 사용자(You): 우측 정렬 + 노란색 카카오톡 말풍선 (#fef01b)
        html = `
            <div class="d-flex justify-content-end mb-3">
                <div class="text-right" style="max-width: 75%;">
                    <div class="font-weight-bold text-dark mb-1" style="font-size: 0.75rem;">👤 You</div>
                    <div class="p-2 px-3 shadow-sm text-left" style="background-color: #fef01b; color: #000000; border-radius: 12px; display: inline-block; word-break: break-word;">
                        ${text.replace(/\n/g, '<br>')}
                    </div>
                </div>
            </div>
        `;
    } else {
        // 에이전트(Agent): 좌측 정렬 + 흰색 말풍선 + 마크다운 파싱 적용
        const parsedText = marked.parse(text);
        html = `
            <div class="d-flex justify-content-start mb-3">
                <div class="text-left" style="max-width: 80%;">
                    <div class="font-weight-bold text-dark mb-1" style="font-size: 0.75rem;">🤖 Agent</div>
                    <div class="p-3 bg-white border shadow-sm text-dark" style="border-radius: 12px; display: inline-block; word-break: break-word;">
                        ${parsedText}
                    </div>
                </div>
            </div>
        `;
    }

    chatBox.append(html);
    chatBox.scrollTop(chatBox[0].scrollHeight);
}

// 로딩 애니메이션
function appendLoading() {
    const chatBox = $('#chat-box');
    const loadingId = 'loading-' + Date.now();
    const html = `
        <div id="${loadingId}" class="d-flex justify-content-start mb-3">
            <div class="bg-white border p-2 rounded shadow-sm">
                <span class="spinner-border spinner-border-sm text-primary" role="status"></span>
                <small class="text-muted ml-2">도구 선택 및 추론 중...</small>
            </div>
        </div>
    `;
    chatBox.append(html);
    chatBox.scrollTop(chatBox[0].scrollHeight);
    return loadingId;
}

// 실행 로그 UI 갱신
function appendLog(logs) {
    const logBox = $('#log-box');
    const timeStamp = new Date().toLocaleTimeString();

    let logText = `\n--- [${timeStamp}] --- \n`;
    if (Array.isArray(logs)) {
        logText += logs.join('\n');
    } else {
        logText += logs;
    }

    logBox.append(logText);
    logBox.scrollTop(logBox[0].scrollHeight);
}
</script>
{% endblock %}
