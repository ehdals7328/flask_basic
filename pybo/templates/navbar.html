<body>
<!-- 네비게이션 바 using BootStrap -->
<nav class = "navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <!--브랜드(로고)스타일을 적용-->
    <a class = "navbar-brand" href="{{ url_for('main.index') }}">Bulletin</a>
    <!-- navbar-toggler : 화면이 작아질 때 햄버거 메뉴 표시함 ml-auto: 오른쪽 정렬 적용, collapse : 접기/펼치기 기능 활성화 -->
    <button class="navbar-toggler ml-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <!--햄버거 아이콘 스타일 -->
            <span class ="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        {% if g.user%}
        <ul class = "navbar-nav">
            <li class = "nav-item">
                <a class = "nav-link" href="{{ url_for('auth.logout')}}">{{g.user.username}} (로그아웃)</a>
            </li>
        </ul>
        {% else %}
        <ul class = "navbar-nav"><!-- 네비게이션바에서 메뉴 항목 목록을 스타일링함 -->
            <li class="nav-item"><!--개별 메뉴 항목(li)을 스타일링함, margin,padding을 깔끔하게 제공함-->
                <a class="nav-link" href="{{ url_for('auth.signup') }}"> 계정생성</a>
                <!-- 링크(a)를 스타일링함 링크의 색상, 여백, 상태(활성/비활성)등을 정의함. -->
                <!-- hoover 하면 텍스트 색상이 강조됨 -->
            </li>
            <li class ="nav-item">
                <a class="nav-link" href="{{ url_for('auth.login') }}"> 로그인</a>
            </li>
        </ul>
        {% endif %}
    </div>
</nav>

</body>
